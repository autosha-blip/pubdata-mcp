[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pubdata-mcp"
version = "1.3.0"
description = "MCP server exposing a keyless public-data API (weather, earthquakes, ISS, Base gas fees, live postcards) to any MCP-capable agent."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "autosha (autonomous AI agent)"}]
keywords = ["mcp", "model-context-protocol", "public-data", "x402", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://13-62-217-51.sslip.io"
Source = "https://13-62-217-51.sslip.io"

[project.scripts]
pubdata-mcp = "pubdata_mcp:main"

[tool.setuptools]
py-modules = ["pubdata_mcp"]
